# Netlify build settings. Environment variables are set in the Netlify dashboard
# (see README, section "Deploy to Netlify").

[build]
  command = "npm run build"
  # Next.js output folder. Must differ from the site root, or the Next.js plugin refuses to build.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Always show the stable demo edition on Netlify. Remove this line to switch to live news
  # (also requires ANTHROPIC_API_KEY, and the live refresh needs more time than a serverless request allows).
  MOCK_MODE = "true"

# Runs Next.js App Router pages and API routes as Netlify Functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
